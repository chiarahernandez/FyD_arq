x-aiven-env: &aiven-env
  DB_HOST: "${DB_HOST:?Falta DB_HOST en .env}"
  DB_PORT: "${DB_PORT:?Falta DB_PORT en .env}"
  DB_USER: "${DB_USER:?Falta DB_USER en .env}"
  DB_PASS: "${DB_PASS:?Falta DB_PASS en .env}"
  DB_NAME: uchfyd
  DB_CA_PATH: /run/certs/aiven-mysql-ca.pem

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  consul:
    image: hashicorp/consul:1.19
    ports: ["8500:8500"]
    command: "agent -server -ui -bootstrap-expect=1 -client=0.0.0.0"

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  auth:
    build: ./auth
    environment:
      MONGO_URL: mongodb://mongo:27017/usuarios
      JWT_SECRET: supersecreto
      CONSUL_HOST: consul
    depends_on: [mongo, consul]
    ports: ["3001:3001"]

  catalogo:
    build: ./catalogo
    environment:
      <<: *aiven-env
      RABBITMQ_URL: amqp://rabbitmq
      CONSUL_HOST: consul
    volumes:
       - ./certs:/run/certs:ro   
    depends_on:
      rabbitmq: { condition: service_started }
      consul: { condition: service_started }
    ports: ["3002:3002"]

  stock:
    build: ./stock
    environment:
      <<: *aiven-env
      RABBITMQ_URL: amqp://rabbitmq
      CONSUL_HOST: consul
    volumes:
      - ./certs/aiven-ca.pem:/run/certs/aiven-ca.pem:ro
    depends_on:
      rabbitmq: { condition: service_started }
      consul: { condition: service_started }
    ports: ["3003:3003"]

  pool:
    build: ./pool
    environment:
      CONSUL_HOST: consul
    depends_on: [consul]
    ports: ["3005:3005"]

  pedidos:
    build: ./pedidos
    environment:
      <<: *aiven-env
      CONSUL_HOST: consul
    volumes:
      - ./certs/aiven-ca.pem:/run/certs/aiven-ca.pem:ro
    depends_on:
      consul: { condition: service_started }
      pool: { condition: service_started }
    ports: ["3004:3004"]

  gateway:
    build: ./gateway
    environment:
      JWT_SECRET: supersecreto
      CONSUL_HOST: consul
    depends_on: [consul, auth, pedidos, catalogo, stock]
    ports: ["3000:3000"]