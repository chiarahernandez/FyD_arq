x-aiven-env: &aiven-env
  DB_HOST: "${DB_HOST:?Falta DB_HOST en .env}"
  DB_PORT: "${DB_PORT:?Falta DB_PORT en .env}"
  DB_USER: "${DB_USER:?Falta DB_USER en .env}"
  DB_PASS: "${DB_PASS:?Falta DB_PASS en .env}"
  DB_NAME: uchfyd
  DB_CA_PATH: /run/certs/aiven-mysql-ca.pem

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  consul:
    image: hashicorp/consul:1.19
    ports: ["8500:8500"]
    command: "agent -server -ui -bootstrap-expect=1 -client=0.0.0.0"

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5673:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  auth:
    build: ./auth
    environment:
      MONGO_URL: ${MONGO_URL:?Falta MONGO_URL en .env}
      JWT_SECRET: supersecreto
      CONSUL_HOST: consul
    depends_on: [mongo, consul]
    ports: ["3001:3001"]

  catalogo:
    build: ./catalogo
    environment:
      <<: *aiven-env
      RABBITMQ_URL: amqp://rabbitmq
      CONSUL_HOST: consul
    volumes:
      - ./certs:/run/certs:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      consul: { condition: service_started }
    ports: ["3002:3002"]

  stock:
    build: ./stock
    environment:
      <<: *aiven-env
      RABBITMQ_URL: amqp://rabbitmq
      CONSUL_HOST: consul
    volumes:
      - ./certs:/run/certs:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      consul: { condition: service_started }
    ports: ["3003:3003"]

  pool:
    build: ./pool
    environment:
      CONSUL_HOST: consul
    depends_on: [consul]
    ports: ["3005:3005"]

  pedidos:
    build: ./pedidos
    environment:
      <<: *aiven-env
      RABBITMQ_URL: amqp://rabbitmq
      CONSUL_HOST: consul
    volumes:
      - ./certs:/run/certs:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      consul: { condition: service_started }
      pool: { condition: service_started }
    ports: ["3004:3004"]

  # Registra el hash de cada pedido en Sepolia. Las variables usan ":-" (no ":?")
  # para que a quien no tenga las claves en su .env solo le falle este servicio
  # y el resto del sistema levante igual.
  blockchain:
    build: ./blockchain
    environment:
      <<: *aiven-env
      RABBITMQ_URL: amqp://rabbitmq
      CONSUL_HOST: consul
      RPC_URL: "${RPC_URL:-}"
      PRIVATE_KEY: "${PRIVATE_KEY:-}"
      CONTRACT_ADDRESS: "${CONTRACT_ADDRESS:-}"
      ETHERSCAN_BASE_URL: https://sepolia.etherscan.io
    volumes:
      - ./certs:/run/certs:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      consul: { condition: service_started }
    restart: on-failure:5
    ports: ["3006:3006"]

  gateway:
    build: ./gateway
    environment:
      JWT_SECRET: supersecreto
      CONSUL_HOST: consul
    depends_on: [consul, auth, pedidos, catalogo, stock]
    ports: ["3000:3000"]